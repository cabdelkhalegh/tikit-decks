*{margin:0;padding:0;box-sizing:border-box}
:root{
  --pink:#E91E8C;--blue:#0066CC;--bg:#F5F6F8;--white:#fff;
  --border:#E9ECEF;--text:#1a1a1a;--muted:#666;--light:#F8F9FA;
  --s-shortlisted:#E3F2FD;--sc-shortlisted:#1565C0;
  --s-contacted:#FFF8E1;--sc-contacted:#F57C00;
  --s-followup:#FFF3E0;--sc-followup:#E65100;
  --s-confirmed:#E8F5E9;--sc-confirmed:#2E7D32;
  --s-declined:#FFEBEE;--sc-declined:#C62828;
  --s-noresp:#F5F5F5;--sc-noresp:#757575;
  --s-shipped:#F3E5F5;--sc-shipped:#6A1B9A;
  --s-delivered:#E0F2F1;--sc-delivered:#00695C;
  --s-posted:#1B5E20;--sc-posted:#fff;
  --s-completed:#004D40;--sc-completed:#fff;
}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;line-height:1.5}
/* TOPBAR */
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.logo{font-weight:900;font-size:14px}.logo em{color:var(--pink);font-style:normal}
.logo span{color:var(--blue)}
.view-badge{background:var(--pink);color:#fff;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.8px}
.view-badge.client{background:var(--blue)}
.topbar-right{display:flex;gap:8px;align-items:center}
.btn{border:none;padding:7px 16px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;transition:.2s}
.btn-primary{background:var(--pink);color:#fff}.btn-primary:hover{background:#C2185B}
.btn-sec{background:var(--white);color:var(--muted);border:1px solid var(--border)}.btn-sec:hover{border-color:var(--pink);color:var(--pink)}
/* STATS */
.stats{display:flex;gap:12px;padding:16px 24px;background:var(--white);border-bottom:1px solid var(--border);overflow-x:auto;flex-wrap:wrap}
.stat{background:var(--light);border-radius:10px;padding:12px 18px;min-width:110px;border:1px solid var(--border)}
.stat .n{font-size:22px;font-weight:900;color:var(--pink)}.stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
.stat.blue .n{color:var(--blue)}
.stat.green .n{color:#2E7D32}
.stat.purple .n{color:#6A1B9A}
/* FILTERS */
.filters{display:flex;gap:8px;padding:12px 24px;background:var(--white);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.filters select,.filters input{border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-size:12px;color:var(--text);background:var(--white);outline:none}
.filters select:focus,.filters input:focus{border-color:var(--pink)}
.filters input{width:200px}
.filter-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
/* TABLE */
.table-wrap{overflow-x:auto;padding:16px 24px}
table{width:100%;border-collapse:collapse;background:var(--white);border-radius:10px;overflow:hidden;border:1px solid var(--border);font-size:12px}
thead tr{background:var(--light);border-bottom:2px solid var(--border)}
th{padding:10px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);text-align:left;white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;cursor:pointer}
tbody tr:hover{background:#FFF5F8}
tbody tr.expanded{background:#FFF5F8}
td{padding:10px 12px;vertical-align:middle}
/* STATUS PILLS */
.status-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.sp-SHORTLISTED{background:var(--s-shortlisted);color:var(--sc-shortlisted)}
.sp-CONTACTED{background:var(--s-contacted);color:var(--sc-contacted)}
.sp-FOLLOW_UP_1,.sp-FOLLOW_UP_2{background:var(--s-followup);color:var(--sc-followup)}
.sp-CONFIRMED,.sp-DETAILS_COLLECTED,.sp-BOX_ASSEMBLED,.sp-BRIEF_SENT{background:var(--s-confirmed);color:var(--sc-confirmed)}
.sp-DECLINED,.sp-DELIVERY_FAILED{background:var(--s-declined);color:var(--sc-declined)}
.sp-NO_RESPONSE,.sp-DID_NOT_POST{background:var(--s-noresp);color:var(--sc-noresp)}
.sp-DISPATCHED,.sp-IN_TRANSIT{background:var(--s-shipped);color:var(--sc-shipped)}
.sp-DELIVERED,.sp-AWAITING_CONTENT{background:var(--s-delivered);color:var(--sc-delivered)}
.sp-POSTED{background:var(--s-posted);color:var(--sc-posted)}
.sp-COMPLETED{background:var(--s-completed);color:var(--sc-completed)}
/* LINKS INSIDE TABLE */
.creator-link{color:var(--blue);text-decoration:none;font-weight:600}.creator-link:hover{text-decoration:underline}
.platform-btn{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;text-decoration:none;margin-right:3px}
.pb-ig{background:linear-gradient(135deg,#f09433,#dc2743);color:#fff}
.pb-tt{background:#000;color:#fff}
.batch-b1{background:#FCE4EC;color:#C2185B;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.batch-b2{background:#E3F2FD;color:#1565C0;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.batch-em{background:#E8F5E9;color:#2E7D32;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
/* EXPANDED ROW */
.expand-row td{padding:0}
.expand-panel{background:#FAFAFA;border-bottom:2px solid var(--border);padding:16px 20px;display:none}
.expand-panel.open{display:block}
.expand-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.field-group{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:12px}
.field-group h4{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:10px}
.field-row{display:flex;flex-direction:column;margin-bottom:8px}
.field-row label{font-size:10px;color:var(--muted);font-weight:600;margin-bottom:3px}
.field-row input,.field-row select,.field-row textarea{border:1px solid var(--border);border-radius:5px;padding:6px 8px;font-size:12px;color:var(--text);outline:none;background:var(--white)}
.field-row input:focus,.field-row select:focus,.field-row textarea:focus{border-color:var(--pink)}
.field-row textarea{resize:vertical;min-height:60px}
.content-links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.content-link-item{display:flex;gap:6px;align-items:center}
.content-link-item input{flex:1}
.content-link-item a{color:var(--blue);font-size:11px;white-space:nowrap}
.save-btn{background:var(--pink);color:#fff;border:none;padding:7px 18px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;margin-top:10px}
.save-btn:hover{background:#C2185B}
/* ACTION BUTTONS */
.action-btns{display:flex;gap:4px;flex-wrap:wrap}
.act-btn{border:none;padding:4px 9px;border-radius:5px;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap}
.act-contact{background:#FFF8E1;color:#F57C00;border:1px solid #FFE082}
.act-accept{background:#E8F5E9;color:#2E7D32;border:1px solid #A5D6A7}
.act-ship{background:#F3E5F5;color:#6A1B9A;border:1px solid #CE93D8}
.act-post{background:var(--s-posted);color:#fff;border:none}
.act-done{background:var(--s-completed);color:#fff;border:none}
/* PAGINATION */
.pagination{display:flex;justify-content:center;align-items:center;gap:8px;padding:16px;background:var(--white);border-top:1px solid var(--border)}
.page-btn{border:1px solid var(--border);background:var(--white);padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer}
.page-btn.active{background:var(--pink);color:#fff;border-color:var(--pink)}
.page-btn:hover:not(.active){border-color:var(--pink);color:var(--pink)}
.page-info{font-size:12px;color:var(--muted)}
/* LOADING */
.loading{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.empty{text-align:center;padding:40px;color:var(--muted)}
/* CLIENT-ONLY hides */
body.client-view .agency-only{display:none!important}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--white);border-radius:12px;padding:24px;width:500px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:800;margin-bottom:16px}
.modal-close{float:right;background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);margin-top:-4px}
@media(max-width:768px){.stats{gap:8px}.stat{min-width:90px;padding:10px 12px}.filters input{width:140px}.expand-grid{grid-template-columns:1fr}.content-links{grid-template-columns:1fr}}

async function init() {
  await ensureTable()
  await loadCreators()
}

async function ensureTable() {
  // Try to select — if table doesn't exist, create it
  const { error } = await db.from(TABLE).select('id').limit(1)
  if (error && error.code === '42P01') {
    // Table doesn't exist — need to create via SQL
    console.log('Table not found, will seed on first insert')
  }
}

async function loadCreators() {
  const { data, error } = await db.from(TABLE).select('*').order('batch').order('name')
  if (error) {
    if (error.code === '42P01') {
      // Table doesn't exist yet — seed it
      await seedData()
      return
    }
    document.getElementById('table-body').innerHTML = `<tr><td colspan="11" class="empty">Error loading data: ${error.message}</td></tr>`
    return
  }
  if (!data || data.length === 0) {
    await seedData()
    return
  }
  allCreators = data
  applyFilters()
  updateStats()
}

async function seedData() {
  document.getElementById('table-body').innerHTML = '<tr><td colspan="11" class="loading">Setting up database for first time... ⏳</td></tr>'
  const seed = getSeedData()
  const { error } = await db.from(TABLE).upsert(seed, { onConflict: 'id', ignoreDuplicates: true })
  if (error) {
    // Try insert instead
    const { error: e2 } = await db.from(TABLE).insert(seed)
    if (e2) {
      document.getElementById('table-body').innerHTML = `<tr><td colspan="11" class="empty">Database setup failed. Please ensure the table exists in Supabase.<br><small>${e2.message}</small></td></tr>`
      return
    }
  }
  await loadCreators()
}

function applyFilters() {
  const batch = document.getElementById('f-batch').value
  const status = document.getElementById('f-status').value
  const category = document.getElementById('f-category').value
  const search = document.getElementById('f-search').value.toLowerCase()
  filtered = allCreators.filter(c => {
    if (batch && c.batch !== batch) return false
    if (status && c.status !== status) return false
    if (category && c.category !== category) return false
    if (search && !c.name.toLowerCase().includes(search) && !(c.handle_ig||'').toLowerCase().includes(search) && !(c.handle_tt||'').toLowerCase().includes(search)) return false
    return true
  })
  page = 1
  renderTable()
  renderPagination()
}

function clearFilters() {
  document.getElementById('f-batch').value = ''
  document.getElementById('f-status').value = ''
  document.getElementById('f-category').value = ''
  document.getElementById('f-search').value = ''
  applyFilters()
}

function renderTable() {
  const tbody = document.getElementById('table-body')
  const start = (page-1)*PAGE_SIZE
  const pageData = filtered.slice(start, start+PAGE_SIZE)
  if (!pageData.length) { tbody.innerHTML = '<tr><td colspan="11" class="empty">No creators found.</td></tr>'; return }
  tbody.innerHTML = pageData.map((c,i) => {
    const statusPill = `<span class="status-pill sp-${c.status}">${STATUS_LABELS[c.status]||c.status}</span>`
    const batchClass = BATCH_CLASSES[c.batch] || ''
    const batchLabel = BATCH_LABELS2[c.batch] || c.batch
    const catLabel = CAT_LABELS[c.category] || c.category
    const igLink = c.ig_url ? `<a href="${c.ig_url}" target="_blank" class="platform-btn pb-ig">📸 IG</a>` : ''
    const ttLink = c.tt_url ? `<a href="${c.tt_url}" target="_blank" class="platform-btn pb-tt">🎵 TT</a>` : ''
    const contentLinks = [c.content_link_1,c.content_link_2,c.content_link_3,c.content_link_4].filter(Boolean)
    const linksHtml = contentLinks.length ? contentLinks.map((l,j) => `<a href="${l}" target="_blank" style="color:var(--blue);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px" title="${l}">▶ Post ${j+1}</a>`).join('') : '<span style="color:#ccc;font-size:11px">—</span>'
    const actionBtns = IS_CLIENT ? '' : buildActionBtns(c)
    const feeDisplay = IS_CLIENT ? '' : `<td>${c.fee_agreed_aed ? `<strong>${c.fee_agreed_aed} AED</strong>` : c.fee_quoted_aed ? `${c.fee_quoted_aed} AED` : '<span style="color:#ccc">—</span>'}</td>`
    const contactedBy = IS_CLIENT ? '' : `<td style="color:var(--muted);font-size:11px">${c.contacted_by||'—'}</td>`
    return `<tr id="tr-${c.id}" onclick="toggleExpand(${c.id},this)">
      <td style="color:var(--muted);font-size:11px">${start+i+1}</td>
      <td>
        <div style="font-weight:700;font-size:13px">${c.name}${c.is_emirati?' 🇦🇪':''}</div>
        <div style="font-size:10px;color:var(--muted)">${c.reach||''}</div>
      </td>
      <td>${igLink}${ttLink}<div style="font-size:11px;color:var(--muted);margin-top:2px">${c.handle_ig||''}</div></td>
      <td><span class="${batchClass}">${batchLabel}</span></td>
      <td style="white-space:nowrap">${catLabel}</td>
      <td style="font-size:11px;color:var(--muted)">${c.reach||'—'}</td>
      <td>${statusPill}</td>
      ${contactedBy}
      ${feeDisplay}
      <td style="min-width:120px">${linksHtml}</td>
      ${IS_CLIENT ? '' : `<td onclick="event.stopPropagation()">${actionBtns}</td>`}
    </tr>
    <tr class="expand-row" id="exp-${c.id}"><td colspan="${IS_CLIENT?7:11}"><div class="expand-panel" id="panel-${c.id}">${buildExpandPanel(c)}</div></td></tr>`
  }).join('')
}

function buildActionBtns(c) {
  const s = c.status
  let btns = ''
  if (s === 'SHORTLISTED') btns += `<button class="act-btn act-contact" onclick="quickStatus(${c.id},'CONTACTED')">📤 Contact</button>`
  if (s === 'CONTACTED') btns += `<button class="act-btn act-contact" onclick="quickStatus(${c.id},'FOLLOW_UP_1')">🔁 F/U 1</button>`
  if (s === 'FOLLOW_UP_1') btns += `<button class="act-btn act-contact" onclick="quickStatus(${c.id},'FOLLOW_UP_2')">🔁 F/U 2</button>`
  if (['CONTACTED','FOLLOW_UP_1','FOLLOW_UP_2'].includes(s)) btns += `<button class="act-btn act-accept" onclick="quickStatus(${c.id},'CONFIRMED')">✅ Accept</button><button class="act-btn" style="background:#FFEBEE;color:#C62828;border:1px solid #FFCDD2" onclick="quickStatus(${c.id},'DECLINED')">❌ Decline</button>`
  if (s === 'CONFIRMED') btns += `<button class="act-btn act-ship" onclick="quickStatus(${c.id},'DISPATCHED')">📦 Shipped</button>`
  if (s === 'DISPATCHED' || s === 'IN_TRANSIT') btns += `<button class="act-btn act-ship" onclick="quickStatus(${c.id},'DELIVERED')">📬 Delivered</button>`
  if (s === 'DELIVERED' || s === 'AWAITING_CONTENT') btns += `<button class="act-btn act-post" onclick="quickStatus(${c.id},'POSTED')">🎬 Posted</button>`
  if (s === 'POSTED') btns += `<button class="act-btn act-done" onclick="quickStatus(${c.id},'COMPLETED')">🏁 Complete</button>`
  return `<div class="action-btns">${btns}</div>`
}

function buildExpandPanel(c) {
  return `<div class="expand-grid">
    <div class="field-group">
      <h4>📤 Outreach</h4>
      <div class="field-row"><label>Status</label>
        <select onchange="saveField(${c.id},'status',this.value)">
          ${Object.entries(STATUS_LABELS).map(([v,l])=>`<option value="${v}"${c.status===v?' selected':''}>${l}</option>`).join('')}
        </select>
      </div>
      <div class="field-row"><label>Contacted By</label><input value="${c.contacted_by||''}" onblur="saveField(${c.id},'contacted_by',this.value)" placeholder="Team member name"></div>
      <div class="field-row"><label>Contacted Date</label><input type="date" value="${c.contacted_date||''}" onblur="saveField(${c.id},'contacted_date',this.value)"></div>
      <div class="field-row"><label>Response Date</label><input type="date" value="${c.response_date||''}" onblur="saveField(${c.id},'response_date',this.value)"></div>
    </div>
    <div class="field-group">
      <h4>📦 Shipping</h4>
      <div class="field-row"><label>Shipping Address</label><textarea onblur="saveField(${c.id},'shipping_address',this.value)" placeholder="Full delivery address">${c.shipping_address||''}</textarea></div>
      <div class="field-row"><label>Tracking Number</label><input value="${c.tracking_number||''}" onblur="saveField(${c.id},'tracking_number',this.value)" placeholder="Courier tracking ID"></div>
      <div class="field-row"><label>Shipped Date</label><input type="date" value="${c.shipped_date||''}" onblur="saveField(${c.id},'shipped_date',this.value)"></div>
      <div class="field-row"><label>Delivered Date</label><input type="date" value="${c.delivered_date||''}" onblur="saveField(${c.id},'delivered_date',this.value)"></div>
    </div>
    <div class="field-group" style="grid-column:1/-1">
      <h4>🎬 Content Links (max 4)</h4>
      <div class="content-links">
        ${[1,2,3,4].map(n => {
          const val = c[`content_link_${n}`]||''
          return `<div class="content-link-item">
            <input value="${val}" onblur="saveField(${c.id},'content_link_${n}',this.value)" placeholder="Paste video URL (TikTok/IG/YouTube)">
            ${val?`<a href="${val}" target="_blank">▶ Open</a>`:''}
          </div>`
        }).join('')}
      </div>
    </div>
    <div class="field-group" style="grid-column:1/-1">
      <h4>📝 Notes</h4>
      <div class="field-row"><textarea onblur="saveField(${c.id},'notes',this.value)" placeholder="Internal notes (not visible to client)">${c.notes||''}</textarea></div>
    </div>
  </div>`
}

function toggleExpand(id, tr) {
  if (IS_CLIENT) return
  const panel = document.getElementById('panel-'+id)
  if (!panel) return
  const isOpen = panel.classList.contains('open')
  // Close all
  document.querySelectorAll('.expand-panel.open').forEach(p => p.classList.remove('open'))
  document.querySelectorAll('tr.expanded').forEach(r => r.classList.remove('expanded'))
  if (!isOpen) { panel.classList.add('open'); tr.classList.add('expanded') }
}

async function quickStatus(id, newStatus) {
  const { error } = await db.from(TABLE).update({status:newStatus, updated_at:new Date().toISOString()}).eq('id',id)
  if (!error) {
    const idx = allCreators.findIndex(c=>c.id===id)
    if (idx>=0) allCreators[idx].status = newStatus
    applyFilters()
    updateStats()
  }
}

async function saveField(id, field, value) {
  const update = {updated_at: new Date().toISOString()}
  update[field] = value || null
  const { error } = await db.from(TABLE).update(update).eq('id',id)
  if (!error) {
    const idx = allCreators.findIndex(c=>c.id===id)
    if (idx>=0) allCreators[idx][field] = value
    if (field === 'status') { applyFilters(); updateStats() }
  }
}

function updateStats() {
  document.getElementById('s-total').textContent = allCreators.length
  document.getElementById('s-shortlisted').textContent = allCreators.filter(c=>c.status==='SHORTLISTED').length
  document.getElementById('s-contacted').textContent = allCreators.filter(c=>['CONTACTED','FOLLOW_UP_1','FOLLOW_UP_2'].includes(c.status)).length
  document.getElementById('s-confirmed').textContent = allCreators.filter(c=>['CONFIRMED','DETAILS_COLLECTED','BOX_ASSEMBLED','BRIEF_SENT'].includes(c.status)).length
  document.getElementById('s-shipped').textContent = allCreators.filter(c=>['DISPATCHED','IN_TRANSIT','DELIVERED','AWAITING_CONTENT'].includes(c.status)).length
  document.getElementById('s-posted').textContent = allCreators.filter(c=>c.status==='POSTED').length
  document.getElementById('s-completed').textContent = allCreators.filter(c=>c.status==='COMPLETED').length
  const decEl = document.getElementById('s-declined')
  if (decEl) decEl.textContent = allCreators.filter(c=>['DECLINED','NO_RESPONSE','DID_NOT_POST'].includes(c.status)).length
}

function renderPagination() {
  const total = filtered.length
  const pages = Math.ceil(total/PAGE_SIZE)
  const pag = document.getElementById('pagination')
  if (pages <= 1) { pag.innerHTML = `<span class="page-info">Showing ${total} creators</span>`; return }
  let html = `<span class="page-info">Page ${page} of ${pages} (${total} creators)</span>`
  if (page > 1) html += `<button class="page-btn" onclick="goPage(${page-1})">‹ Prev</button>`
  for (let i=Math.max(1,page-2);i<=Math.min(pages,page+2);i++) html += `<button class="page-btn${i===page?' active':''}" onclick="goPage(${i})">${i}</button>`
  if (page < pages) html += `<button class="page-btn" onclick="goPage(${page+1})">Next ›</button>`
  pag.innerHTML = html
}

function goPage(p) { page = p; renderTable(); renderPagination(); window.scrollTo(0,200) }

async function addCreator() {
  const name = document.getElementById('new-name').value.trim()
  if (!name) return alert('Name is required')
  const { error } = await db.from(TABLE).insert({
    name, handle_ig: document.getElementById('new-ig').value.trim(),
    handle_tt: document.getElementById('new-tt').value.trim(),
    batch: document.getElementById('new-batch').value,
    category: document.getElementById('new-cat').value,
    reach: document.getElementById('new-reach').value.trim(),
    status: 'SHORTLISTED', market: 'UAE', priority: 'P2',
    created_at: new Date().toISOString(), updated_at: new Date().toISOString()
  })
  if (error) return alert('Error: '+error.message)
  closeModal('add-modal')
  await loadCreators()
}

function exportCSV() {
  const data = filtered.length ? filtered : allCreators
  const cols = IS_CLIENT
    ? ['name','handle_ig','handle_tt','batch','category','reach','status','content_link_1','content_link_2','content_link_3','content_link_4']
    : ['name','handle_ig','handle_tt','batch','category','reach','status','contacted_by','fee_quoted_aed','fee_agreed_aed','tracking_number','shipped_date','delivered_date','content_link_1','content_link_2','content_link_3','content_link_4','notes']
  const headers = cols.map(c=>c.replace(/_/g,' ').toUpperCase())
  const rows = data.map(r => cols.map(c => `"${(r[c]||'').toString().replace(/"/g,'""')}"`).join(','))
  const csv = [headers.join(','), ...rows].join('\n')
  const blob = new Blob([csv],{type:'text/csv'})
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a'); a.href=url; a.download='bioderma-tracker.csv'; a.click()
  URL.revokeObjectURL(url)
}

function showAddModal() { document.getElementById('add-modal').classList.add('open') }
function closeModal(id) { document.getElementById(id).classList.remove('open') }

init()
</script>
