// ===== HELPERS =====
function parseReach(r) {
  if (!r) return 0;
  const s = r.toString().toUpperCase().trim();
  if (s.endsWith('K')) return parseFloat(s) * 1000;
  if (s.endsWith('M')) return parseFloat(s) * 1000000;
  return parseFloat(s) || 0;
}

function formatReachTotal(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(0) + 'K';
  return n.toString();
}

function getStatusClass(status) {
  return 's-' + (status || 'Shortlisted').replace(/ /g, '-');
}

function showToast(msg, type='') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function showLoading(msg='Loading...') {
  document.getElementById('loadingText').textContent = msg;
  document.getElementById('loadingOverlay').classList.add('visible');
}
function hideLoading() {
  document.getElementById('loadingOverlay').classList.remove('visible');
}

function escapeHtml(s) {
  if (!s) return '';
  return s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getContentLinkCount(c) {
  return [c.content_link_1,c.content_link_2,c.content_link_3,c.content_link_4].filter(Boolean).length;
}

// ===== INIT =====
async function init() {
  showLoading('Connecting to Supabase...');
  try {
    await ensureTable();
    showLoading('Loading creators...');
    await loadCreators();
    render();
    hideLoading();
  } catch(e) {
    hideLoading();
    showToast('Error: ' + e.message, 'error');
    console.error(e);
  }
}

async function ensureTable() {
  // Try to read — if table doesn't exist the error will surface
  // Supabase auto-creates via RLS but we try to seed if empty
  const { count, error } = await db.from(TABLE).select('*', {count:'exact', head:true});
  if (error && error.code === '42P01') {
    // Table doesn't exist — we cannot CREATE TABLE via JS client (no DDL)
    // Show helpful message
    showToast('⚠️ Table not found — please create it in Supabase Dashboard first', 'error');
    throw new Error('Table bioderma_creators does not exist. Please create it via Supabase SQL Editor using the provided schema.');
  }
  if (!error && count === 0) {
    await seedData();
  }
}

async function seedData() {
  showLoading('Seeding 95 creators...');
  const rows = SEED_CREATORS.map(c => ({
    batch: c.batch,
    name: c.name,
    handle: c.handle || null,
    ig_url: c.ig_url || null,
    tt_url: c.tt_url || null,
    category: c.category || null,
    reach: c.reach || null,
    market: 'UAE',
    priority: c.priority || 'P2',
    is_emirati: c.is_emirati || false,
    status: 'Shortlisted',
    compensation_type: 'PR Gift',
  }));

  // Insert in batches of 50
  for (let i = 0; i < rows.length; i += 50) {
    const batch = rows.slice(i, i + 50);
    const { error } = await db.from(TABLE).insert(batch);
    if (error) console.warn('Seed error:', error.message);
  }
}

async function loadCreators() {
  const { data, error } = await db.from(TABLE).select('*').order('batch').order('name');
  if (error) throw error;
  allCreators = data || [];
  applyFilters();
}

// ===== FILTERS =====
function applyFilters() {
  let result = [...allCreators];
  const { batch, status, category, search } = currentFilters;
  if (batch === 'EM') result = result.filter(c => c.batch === 'EM' || c.is_emirati);
  else if (batch) result = result.filter(c => c.batch === batch);
  if (status) result = result.filter(c => c.status === status);
  if (category) result = result.filter(c => c.category === category);
  if (search) {
    const q = search.toLowerCase();
    result = result.filter(c =>
      (c.name||'').toLowerCase().includes(q) ||
      (c.handle||'').toLowerCase().includes(q) ||
      (c.notes||'').toLowerCase().includes(q)
    );
  }
  // Sort
  result.sort((a, b) => {
    let va = a[sortCol] || '', vb = b[sortCol] || '';
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    if (va < vb) return sortDir === 'asc' ? -1 : 1;
    if (va > vb) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });
  filteredCreators = result;
  currentPage = 1;
}

function getPageCreators() {
  const start = (currentPage - 1) * PAGE_SIZE;
  return filteredCreators.slice(start, start + PAGE_SIZE);
}

// ===== STATS =====
function computeStats(creators) {
  const total = creators.length;
  const sl = creators.filter(c=>c.status==='Shortlisted').length;
  const contacted = creators.filter(c=>['Contacted','No Response'].includes(c.status)).length;
  const accepted = creators.filter(c=>['Accepted','Brief Sent','Box Shipped','Box Received','Posted','Verified','Completed'].includes(c.status)).length;
  const posted = creators.filter(c=>['Posted','Verified','Completed'].includes(c.status)).length;
  const completed = creators.filter(c=>c.status==='Completed').length;
  const inProgress = creators.filter(c=>!['Shortlisted','Completed','Declined','No Response'].includes(c.status)).length;
  const totalReach = creators.reduce((s,c) => s + parseReach(c.reach), 0);
  return { total, sl, contacted, accepted, posted, completed, inProgress, totalReach };
}

        : `<button class="btn btn-secondary btn-sm" onclick="openContentModal(${c.id})">+ Link</button>`}

        ${c.status === 'Contacted' ? `<button class="btn btn-secondary btn-sm" onclick="quickAction(${c.id}, 'Accepted')">✅ Accept</button>` : ''}
        ${c.status === 'Accepted' ? `<button class="btn btn-secondary btn-sm" onclick="quickAction(${c.id}, 'Box Shipped')">📦 Ship</button>` : ''}
        ${c.status === 'Box Shipped' ? `<button class="btn btn-secondary btn-sm" onclick="quickAction(${c.id}, 'Box Received')">✔ Rcvd</button>` : ''}
        ${c.status === 'Box Received' ? `<button class="btn btn-secondary btn-sm" onclick="quickAction(${c.id}, 'Posted')">📸 Posted</button>` : ''}
        ${c.status === 'Posted' ? `<button class="btn btn-secondary btn-sm" onclick="quickAction(${c.id}, 'Verified')">🔍 Verify</button>` : ''}

        <button class="btn btn-secondary btn-sm" onclick="openEditModal(${c.id})" title="Full Edit">✏️</button>

  </tr>`;
}

// ===== INTERACTIONS =====
function attachFilterListeners() {
  // Already using inline onchange/oninput handlers
}

function onFilterChange() {
  currentFilters.batch = document.getElementById('filterBatch')?.value || '';
  currentFilters.status = document.getElementById('filterStatus')?.value || '';
  currentFilters.category = document.getElementById('filterCategory')?.value || '';
  currentFilters.search = document.getElementById('filterSearch')?.value || '';
  applyFilters();
  rerenderTable();
}

function clearFilters() {
  currentFilters = { batch: '', status: '', category: '', search: '' };
  applyFilters();
  render();
}

function rerenderTable() {
  // Re-render just the changing parts
  render();
}

function goPage(p) {
  const totalPages = Math.ceil(filteredCreators.length / PAGE_SIZE);
  if (p < 1 || p > totalPages) return;
  currentPage = p;
  render();
  window.scrollTo(0, 0);
}

function setSort(col) {
  if (sortCol === col) {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    sortCol = col;
    sortDir = 'asc';
  }
  applyFilters();
  render();
}

function switchView(v) {
  const url = new URL(window.location.href);
  if (v === 'client') url.searchParams.set('view', 'client');
  else url.searchParams.delete('view');
  window.location.href = url.toString();
}

// ===== INLINE EDIT =====
function editStatusInline(id, el) {
  if (!isAgency()) return;
  const creator = allCreators.find(c => c.id === id);
  if (!creator) return;
  const sel = document.createElement('select');
  sel.className = 'inline-select';
  STATUSES.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    if (s === creator.status) opt.selected = true;
    sel.appendChild(opt);
  });
  el.replaceWith(sel);
  sel.focus();
  sel.addEventListener('change', async () => {
    const val = sel.value;
    await updateCreator(id, { status: val });
  });
  sel.addEventListener('blur', async () => {
    const val = sel.value;
    await updateCreator(id, { status: val });
    render();
  });
}

function editFieldInline(id, field, el) {
  if (!isAgency()) return;
  const creator = allCreators.find(c => c.id === id);
  if (!creator) return;
  const inp = document.createElement('input');
  inp.className = 'inline-input';
  inp.value = creator[field] || '';
  inp.type = field.includes('fee') || field.includes('aed') ? 'number' : 'text';
  const origWidth = el.offsetWidth || 120;
  inp.style.width = Math.max(origWidth, 100) + 'px';
  el.replaceWith(inp);
  inp.focus();
  inp.select();
  const save = async () => {
    const val = inp.value.trim();
    const update = {};
    update[field] = val || null;
    await updateCreator(id, update);
    render();
  };
  inp.addEventListener('blur', save);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { inp.blur(); }
    if (e.key === 'Escape') { render(); }
  });
}

async function quickAction(id, newStatus) {
  const extraFields = {};
  const now = new Date().toISOString().split('T')[0];
  if (newStatus === 'Contacted') extraFields.contacted_date = now;
  if (newStatus === 'Accepted') extraFields.response_date = now;
  if (newStatus === 'Box Shipped') extraFields.shipped_date = now;
  if (newStatus === 'Box Received') { extraFields.received_confirmed = true; extraFields.received_date = now; }
  if (newStatus === 'Brief Sent') { extraFields.brief_sent = true; extraFields.brief_sent_date = now; }
  await updateCreator(id, { status: newStatus, ...extraFields });
  render();
}

async function updateCreator(id, fields) {
  fields.updated_at = new Date().toISOString();
  const { error } = await db.from(TABLE).update(fields).eq('id', id);
  if (error) {
    showToast('Save failed: ' + error.message, 'error');
    return;
  }
  // Update local state
  const idx = allCreators.findIndex(c => c.id === id);
  if (idx !== -1) Object.assign(allCreators[idx], fields);
  applyFilters();
  showToast('✓ Saved', 'success');
}

// ===== CONTENT MODAL =====
function openContentModal(id) {
  activeModalId = id;
  const creator = allCreators.find(c => c.id === id);
  if (!creator) return;
  document.getElementById('modalCreatorName').textContent = creator.name;
  document.getElementById('contentLink1').value = creator.content_link_1 || '';
  document.getElementById('contentLink2').value = creator.content_link_2 || '';
  document.getElementById('contentLink3').value = creator.content_link_3 || '';
  document.getElementById('contentLink4').value = creator.content_link_4 || '';
  document.getElementById('contentModal').classList.add('open');
}

function closeContentModal() {
  document.getElementById('contentModal').classList.remove('open');
  activeModalId = null;
}

async function saveContentLinks() {
  if (!activeModalId) return;
  const fields = {
    content_link_1: document.getElementById('contentLink1').value.trim() || null,
    content_link_2: document.getElementById('contentLink2').value.trim() || null,
    content_link_3: document.getElementById('contentLink3').value.trim() || null,
    content_link_4: document.getElementById('contentLink4').value.trim() || null,
  };
  // Auto-advance status to Posted if at least 1 link
  const hasLinks = Object.values(fields).some(Boolean);
  const creator = allCreators.find(c => c.id === activeModalId);
  if (hasLinks && creator && !['Posted','Verified','Completed'].includes(creator.status)) {
    fields.status = 'Posted';
  }
  await updateCreator(activeModalId, fields);
  closeContentModal();
  render();
}

// ===== EDIT MODAL =====
function openEditModal(id) {
  activeEditId = id;
  const c = allCreators.find(x => x.id === id);
  if (!c) return;
  document.getElementById('editModalName').textContent = c.name;

  const fields = [
    { key: 'status', label: 'Status', type: 'select', options: STATUSES },
    { key: 'contacted_by', label: 'Contacted By', type: 'text' },
    { key: 'contacted_date', label: 'Contacted Date', type: 'date' },
    { key: 'response_date', label: 'Response Date', type: 'date' },
    { key: 'compensation_type', label: 'Compensation Type', type: 'select', options: ['PR Gift','Paid','Gifted + Fee','Barter'] },
    { key: 'fee_quoted_aed', label: 'Fee Quoted (AED)', type: 'number' },
    { key: 'fee_agreed_aed', label: 'Fee Agreed (AED)', type: 'number' },
    { key: 'shipping_address', label: 'Shipping Address', type: 'text' },
    { key: 'tracking_number', label: 'Tracking Number', type: 'text' },
    { key: 'shipped_date', label: 'Shipped Date', type: 'date' },
    { key: 'posting_deadline', label: 'Posting Deadline', type: 'date' },
    { key: 'notes', label: 'Notes', type: 'text' },
  ];

  const body = document.getElementById('editModalBody');
  body.innerHTML = fields.map(f => {
    if (f.type === 'select') {
      return `<div class="form-group">
        <label>${f.label}</label>
        <select class="inline-select" id="ef_${f.key}" style="width:100%;padding:8px;border:1px solid #dde1e7;border-radius:6px;font-size:13px;">
          ${f.options.map(o=>`<option value="${o}" ${(c[f.key]||'')=== o ?'selected':''}>${o}</option>`).join('')}
        </select>
      </div>`;
    }
    return `<div class="form-group">
      <label>${f.label}</label>
      <input type="${f.type}" id="ef_${f.key}" value="${escapeHtml(c[f.key]||'')}" placeholder="${f.label}">
    </div>`;
  }).join('');

  // Add checkboxes
  body.innerHTML += `
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:4px;">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;"><input type="checkbox" id="ef_brief_sent" ${c.brief_sent?'checked':''}> Brief Sent</label>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;"><input type="checkbox" id="ef_received_confirmed" ${c.received_confirmed?'checked':''}> Box Received</label>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;"><input type="checkbox" id="ef_content_verified" ${c.content_verified?'checked':''}> Content Verified</label>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;"><input type="checkbox" id="ef_client_approved" ${c.client_approved?'checked':''}> Client Approved</label>
    </div>
  `;

  document.getElementById('editModal').classList.add('open');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('open');
  activeEditId = null;
}

async function saveEditModal() {
  if (!activeEditId) return;
  const fields = ['status','contacted_by','contacted_date','response_date','compensation_type','fee_quoted_aed','fee_agreed_aed','shipping_address','tracking_number','shipped_date','posting_deadline','notes'];
  const update = {};
  fields.forEach(f => {
    const el = document.getElementById('ef_' + f);
    if (el) update[f] = el.value.trim() || null;
  });
  ['brief_sent','received_confirmed','content_verified','client_approved'].forEach(f => {
    const el = document.getElementById('ef_' + f);
    if (el) update[f] = el.checked;
  });
  await updateCreator(activeEditId, update);
  closeEditModal();
  render();
}

// ===== CSV EXPORT =====
function exportCSV() {
  const creators = filteredCreators.length ? filteredCreators : allCreators;
  const cols = isAgency()
    ? ['id','batch','name','handle','category','reach','status','contacted_by','contacted_date','response_date','compensation_type','fee_quoted_aed','fee_agreed_aed','tracking_number','shipped_date','received_date','posting_deadline','content_link_1','content_link_2','content_link_3','content_link_4','content_verified','notes','client_approved']
    : ['id','batch','name','handle','category','reach','status','content_link_1','content_link_2','content_link_3','content_link_4'];
  
  const header = cols.join(',');
  const rows = creators.map(c =>
    cols.map(col => {
      const v = c[col];
      if (v === null || v === undefined) return '';
      const s = v.toString();
      if (s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g,'""') + '"';
      return s;
    }).join(',')
  );
  const csv = [header, ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `bioderma-xdefense-tracker-${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV downloaded (' + creators.length + ' creators)', 'success');
}

// ===== REFRESH =====
async function refreshData() {
  showLoading('Refreshing...');
  try {
    await loadCreators();
    render();
    showToast('✓ Data refreshed', 'success');
  } catch(e) {
    showToast('Refresh failed: ' + e.message, 'error');
  } finally {
    hideLoading();
  }
}
